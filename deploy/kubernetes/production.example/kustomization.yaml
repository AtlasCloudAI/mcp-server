apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 生产 overlay。用法见 deploy/kubernetes/README.md。
#
# 这份 overlay 是「自包含」的：它把每一个生产要用的环境变量都完整写出来，
# 不依赖 base/staging.yaml 里的值是否为最新——base 目前仍留着旧的
# subject-map 架构，直接继承会起不来。

resources:
  - ../base

patches:
  - path: production-patch.yaml
  # 自建授权页已被官网 OIDC（auth.atlascloud.ai）取代，生产不部署。
  - path: drop-auth-app.yaml

images:
  - name: registry.atlascloud.ai/vcv-dg/atlascloud-mcp-openai-plugin
    # v2.7.2，由 CI 从 commit 24e3bd4 构建（run 37782348685）。
    # 按 digest 固定而不是按标签：标签可以被重新推覆盖，digest 不能。
    # 换版本时同时更新上面这行注释，否则没人知道跑的是哪一版。
    digest: sha256:74b6c93cf039133f620c6d2d091ee71ffea4c458f206a676b08a4ab6b994b21a
