apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlascloud-openai-mcp
  namespace: mcp-servers
spec:
  template:
    spec:
      containers:
        - name: mcp
          env:
            # ---- 发布档位 ----
            - name: PLUGIN_RELEASE_TIER
              value: production

            # ---- 本服务的对外身份 ----
            # 这三个值必须两两一致：MCP_PUBLIC_URL 就是资源标识，
            # 而 MCP_OAUTH_AUDIENCE 必须和生产授权服务器里登记的资源标识逐字符相同。
            - name: MCP_PUBLIC_URL
              value: https://mcp.atlascloud.ai/mcp
            - name: MCP_OAUTH_AUDIENCE
              value: https://mcp.atlascloud.ai/mcp
            - name: MCP_ALLOWED_HOSTS
              value: mcp.atlascloud.ai

            # ---- 授权服务器（官网生产 OIDC，已在线）----
            # 这几个值已用 https://auth.atlascloud.ai/.well-known/oauth-authorization-server
            # 核对过：端点都在根路径，不是 /api/v1/oidc/*。
            # 启动自检会拿 MCP_OAUTH_JWKS_URI 和上面这份元数据对账，写错则 Pod 永不就绪。
            - name: MCP_OAUTH_ISSUER
              value: https://auth.atlascloud.ai
            - name: MCP_OAUTH_JWKS_URI
              value: https://auth.atlascloud.ai/jwks
            - name: MCP_OAUTH_ENDPOINT_HOSTS
              value: auth.atlascloud.ai

            # ---- 凭据模式：令牌交换 ----
            # 服务端不保存任何用户 API key。每个请求把调用者自己的 OAuth 令牌
            # 换成一枚面向模型 API 的令牌，所以生成费用记在调用者自己的账户上。
            - name: MCP_CREDENTIAL_MODE
              value: oauth-exchange
            - name: MCP_TOKEN_EXCHANGE_URL
              value: https://auth.atlascloud.ai/token
            - name: MCP_TOKEN_EXCHANGE_RESOURCE
              value: https://api.atlascloud.ai
            # ↓ 由生产授权服务器管理员登记 token-exchange 客户端后提供
            - name: MCP_TOKEN_EXCHANGE_CLIENT_ID
              value: REPLACE_WITH_PRODUCTION_CLIENT_ID
            - name: MCP_TOKEN_EXCHANGE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atlas-mcp-token-exchange
                  key: client-secret

            # ---- 上游 ----
            # 同集群优先走内网：省一跳公网和一次 TLS，也绕开网关的路径白名单。
            # 拿不到内网地址就都填 https://api.atlascloud.ai（公网可用，只是慢一点）。
            - name: ATLASCLOUD_API_BASE_URL
              value: REPLACE_WITH_BACKEND_BASE_URL
            - name: ATLASCLOUD_GENERATION_API_BASE_URL
              value: REPLACE_WITH_AIPROXY_BASE_URL

            # ---- 下面两项在 oauth-exchange 模式下是死配置，删掉 ----
            # subject-map 架构的遗留：服务端不再保存用户凭据，
            # 既没有要映射的 key，也没有要加密的东西。
            - name: MCP_ATLAS_SUBJECT_KEYS_JSON
              $patch: delete
            - name: MCP_CREDENTIAL_ENCRYPTION_KEYS_JSON
              $patch: delete

          # 探针要带上生产 Host，否则会被 MCP_ALLOWED_HOSTS 拦掉，
          # 表现为 Pod 一直不就绪、但日志里看不出原因。
          readinessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: mcp.atlascloud.ai
          livenessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: mcp.atlascloud.ai
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlascloud-openai-plugin
  namespace: mcp-servers
  annotations:
    # 网关类型决定注解写法。若生产用的不是 higress/nginx-ingress，
    # 这四条要换成对应网关的等价写法——超时必须给够，MCP 是流式长连接，
    # 默认 60s 会把生成中的请求掐断。
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: 256k
    cert-manager.io/cluster-issuer: letsencrypt-dns01
spec:
  # 只有一个 host。dev 上那个 atlascloud-auth.dev.atlascloud.ai
  # 是自建授权页，已被官网 OIDC 取代，生产不要复刻。
  rules:
    - host: mcp.atlascloud.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atlascloud-openai-mcp
                port:
                  number: 80
  tls:
    - hosts:
        - mcp.atlascloud.ai
      secretName: atlascloud-mcp-production-tls
