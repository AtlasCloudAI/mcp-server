# Secret 模板 —— 只有结构，没有值。
#
# 真实的 02-secrets.yaml 不进仓库（见同目录 .gitignore）：这个仓库是公开的。
# 填好值的那份留在本地、密钥管理系统或 Sealed Secret 里。
#
# 生成随机值：openssl rand -hex 32
---
apiVersion: v1
kind: Secret
metadata:
  name: atlascloud-openai-plugin
  namespace: atlas-mcp
type: Opaque
stringData:
  # 托管 Redis 的连接串。必须带密码，否则生产档位拒绝启动。
  # 形如 redis://:<密码>@<主机>:6379/<db>
  redis-url: "REPLACE_ME"

  # 至少 32 字节随机值。$20 以上生成的报价确认令牌用它做 HMAC，
  # 每个副本必须是同一个值，否则 A 副本发的报价在 B 副本上验不过。
  generation-confirmation-secret: "REPLACE_ME"

  # OpenAI 插件门户的校验 token。
  openai-challenge-token: "REPLACE_ME"

  # ⚠️ oauth-exchange 模式下这一项是【死配置】，代码根本不会读到它 ——
  #    createConfiguredCredentialResolver 在建 store 之前就 return 了。
  #    它属于 redis-subject-map 那一代（服务端保存加密后的用户 key）。
  #    建议连同 04-deployment.yaml 里对应的 env 一起删掉。
  # credential-encryption-keys-json: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: atlas-mcp-token-exchange
  namespace: atlas-mcp
type: Opaque
stringData:
  # 生产授权服务器登记 token-exchange 客户端时产生的【明文】secret。
  # 授权服务器库里只存 bcrypt 哈希，事后取不出来 —— 登记当时不记下就没了。
  client-secret: "REPLACE_ME"
