# Service
apiVersion: v1
kind: Service
metadata:
  name: atlas-mcp
  namespace: atlas-mcp
  labels:
    app.kubernetes.io/component: mcp
    app.kubernetes.io/name: atlas-mcp
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/component: mcp
    app.kubernetes.io/name: atlas-mcp
  internalTrafficPolicy: Cluster
  sessionAffinity: None
