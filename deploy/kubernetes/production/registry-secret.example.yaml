# 镜像拉取凭据模板 —— 只有结构，没有值。
#
# 真实的 registry-secret.yaml 不进仓库（见同目录 .gitignore）。
#
# 也可以不写 YAML，直接建：
#   kubectl -n atlas-mcp create secret docker-registry atlas-registry-secret \
#     --docker-server=registry.atlascloud.ai \
#     --docker-username='<用户名>' \
#     --docker-password='<密码>'
# 这样密码不会落到任何文件里。
apiVersion: v1
kind: Secret
metadata:
  name: atlas-registry-secret
  namespace: atlas-mcp
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "registry.atlascloud.ai": {
          "username": "REPLACE_ME",
          "password": "REPLACE_ME"
        }
      }
    }
